name: Apieron
description: 'Apieron Inc. was a private, venture-backed medical device company headquartered in Menlo
  Park, California, formed in early 2001 to develop a simple-to-use, non-invasive monitor for the
  measurement of exhaled nitric oxide (eNO) as an aid in the management of asthma. Its patented
  biosensor platform enabled highly sensitive detection of selected analytes, and its Insight eNO
  System received U.S. Food and Drug Administration clearance and launched in the United States in
  2008. Following that launch Aerocrine filed patent-infringement complaints against Apieron and
  Apieron counterclaimed; citing the legal setbacks and a lack of financing, Apieron filed a Chapter 7
  bankruptcy petition in the U.S. Bankruptcy Court for the Northern District of California on 30 March
  2010. At a court auction on 12 May 2010 Aerocrine acquired all of Apieron''s business assets,
  including its patent and trademark portfolio, ending the litigation; the Insight product was
  discontinued and not returned to supply. Apieron was a clinical-hardware company and never published
  a public API, developer portal, SDK, or machine-readable interface. This profile is retained as a
  historical record of the Canaan Partners portfolio and is not an active API provider.'
